<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despensa Soltys - Inventario</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--pr:#2563eb;--ok:#16a34a;--er:#dc2626;--wa:#d97706;--bd:#e2e6ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--mu:#93a0b1;--pr:#4f8bff;--ok:#34d399;--er:#f87171;--wa:#fbbf24;--bd:#2b3644}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.marca{background:#dc2626;color:#fff;text-align:center;font-size:1.3rem;font-weight:700;letter-spacing:.5px;padding:12px 16px;border-radius:12px;margin-bottom:8px}
h1{font-size:1.4rem;margin:12px 0 4px;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0 0 20px}
.menu{display:grid;gap:14px}
.big{display:flex;align-items:center;gap:16px;padding:22px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:1.15rem;font-weight:600;cursor:pointer;text-align:left;width:100%}
.big:hover{border-color:var(--pr)}
.big .i{font-size:2rem}
.big small{display:block;font-weight:400;color:var(--mu);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.95rem}
.top h2{margin:0;font-size:1.25rem}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
input:focus{outline:2px solid var(--pr)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
.btn.red{background:var(--er)}
.btn:disabled{opacity:.6}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.92rem;display:none}
.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.er{display:block;background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}
.hint{font-size:.85rem;color:var(--mu);margin-top:6px;min-height:1.2em}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:.8rem;text-transform:uppercase}
.n{text-align:right}
.low{color:var(--wa);font-weight:700}.zero{color:var(--er);font-weight:700}
.stats{display:flex;gap:16px;color:var(--mu);font-size:.88rem;margin:10px 0 0;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:22px 0}
h3{font-size:1rem;margin:0 0 8px}
.out{background:none;border:0;color:var(--mu);margin:22px auto 0;display:block;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<div class="marca">Despensa Soltys</div>

<!-- LOGIN -->
<section id="v-login" hidden>
  <h1>Iniciar sesión</h1>
  <div class="card">
    <label for="l-mail">Correo</label>
    <input id="l-mail" type="email" autocomplete="username">
    <label for="l-pass">Contraseña</label>
    <input id="l-pass" type="password" autocomplete="current-password">
    <button class="btn" id="l-ok">Entrar</button>
    <div class="msg" id="l-msg"></div>
  </div>
</section>

<!-- MENÚ -->
<section id="v-menu" hidden>
  <h1>Control de Inventario</h1>
  <p class="sub">¿Qué desea hacer?</p>
  <div class="menu">
    <button class="big" data-go="reg"><span class="i"></span><span>Registrar nuevos productos<small>Ingresar productos o sumar stock a uno existente</small></span></button>
    <button class="big" data-go="inv"><span class="i"></span><span>Ver el inventario<small>Buscar por nombre o por código</small></span></button>
    <button class="big" data-go="ven"><span class="i"></span><span>Restar (registrar venta)<small>Descontar unidades vendidas</small></span></button>
  </div>
  <button class="out" id="logout">Cerrar sesión</button>
</section>

<!-- REGISTRAR -->
<section id="v-reg" hidden>
  <div class="top"><button class="back" data-go="menu">← Menú</button><h2>Registrar productos</h2></div>
  <div class="card">
    <label for="r-cod">Código (único)</label>
    <input id="r-cod" autocomplete="off" placeholder="Ej: P001">
    <div class="hint" id="r-hint"></div>
    <label for="r-nom">Nombre del producto</label>
    <input id="r-nom" autocomplete="off" placeholder="Ej: Arroz 1kg">
    <div class="row">
      <div><label for="r-can">Cantidad que ingresa</label><input id="r-can" type="number" min="1" step="1" inputmode="numeric"></div>
      <div><label for="r-pre">Precio (opcional)</label><input id="r-pre" type="number" min="0" step="any" inputmode="decimal"></div>
    </div>
    <button class="btn" id="r-ok">Guardar ingreso</button>
    <div class="msg" id="r-msg"></div>
  </div>
</section>

<!-- INVENTARIO -->
<section id="v-inv" hidden>
  <div class="top"><button class="back" data-go="menu">← Menú</button><h2>Inventario</h2></div>
  <div class="card">
    <input id="i-q" placeholder=" Buscar por nombre o código..." autocomplete="off">
    <div class="stats" id="i-st"></div>
    <div class="tw" style="margin-top:10px"><table>
      <thead><tr><th>Código</th><th>Producto</th><th class="n">Stock</th><th class="n">Precio</th></tr></thead>
      <tbody id="i-tb"></tbody></table></div>
    <div class="empty" id="i-em" hidden>No se encontraron productos.</div>
  </div>
</section>

<!-- VENTA -->
<section id="v-ven" hidden>
  <div class="top"><button class="back" data-go="menu">← Menú</button><h2>Registrar venta</h2></div>
  <div class="card">
    <label for="v-cod">Código del producto</label>
    <input id="v-cod" autocomplete="off" placeholder="Ej: P001">
    <div class="hint" id="v-hint"></div>
    <label for="v-can">Cantidad vendida</label>
    <input id="v-can" type="number" min="1" step="1" inputmode="numeric" value="1">
    <button class="btn red" id="v-ok">Registrar venta</button>
    <div class="msg" id="v-msg"></div>
  </div>
  <div class="card">
    <h3>Últimas ventas</h3>
    <div class="tw"><table>
      <thead><tr><th>Fecha</th><th>Código</th><th>Producto</th><th class="n">Cant.</th></tr></thead>
      <tbody id="v-tb"></tbody></table></div>
    <div class="empty" id="v-em">Aún no hay ventas.</div>
  </div>
</section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,runTransaction,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== PEGÁ AQUÍ TU CONFIGURACIÓN DE FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBuLswwmAD9tIdcGIoYfTy4V5zyMlEe6Vs",
  authDomain: "soltys-inventario.firebaseapp.com",
  projectId: "soltys-inventario",
  storageBucket: "soltys-inventario.firebasestorage.app",
  messagingSenderId: "865344729009",
  appId: "1:865344729009:web:4710a1ea06d9e8979e5790"
};
/* ==================================================== */

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').trim().toUpperCase();
const idOf=c=>c.replace(/\//g,'-');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n>0?Number(n).toLocaleString('es',{maximumFractionDigits:2}):'—';
let prods={}, ventas=[], unsubs=[];

function show(v){
  ['login','menu','reg','inv','ven'].forEach(x=>$('v-'+x).hidden=(x!==v));
  window.scrollTo(0,0);
  if(v==='inv')renderInv(); if(v==='ven'){renderVen();hint('v')} if(v==='reg')hint('r');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go)});
function msg(id,t,ok){const m=$(id);m.textContent=t;m.className='msg '+(ok?'ok':'er')}

/* ---- Sesión ---- */
$('l-ok').onclick=async()=>{
  try{await signInWithEmailAndPassword(auth,$('l-mail').value.trim(),$('l-pass').value);}
  catch(e){msg('l-msg','Correo o contraseña incorrectos.')}
};
$('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('l-ok').click()});
$('logout').onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  unsubs.forEach(u=>u());unsubs=[];
  if(!user){prods={};ventas=[];show('login');return}
  unsubs.push(onSnapshot(collection(db,'productos'),s=>{
    prods={};s.forEach(d=>prods[d.id]=d.data());
    if(!$('v-inv').hidden)renderInv(); hint('r'); hint('v');
  }));
  unsubs.push(onSnapshot(query(collection(db,'ventas'),orderBy('ms','desc'),limit(10)),s=>{
    ventas=[];s.forEach(d=>ventas.push(d.data()));
    if(!$('v-ven').hidden)renderVen();
  }));
  show('menu');
});

/* ---- Pistas ---- */
function hint(p){
  const c=idOf(norm($(p+'-cod').value)), h=$(p+'-hint'), pr=prods[c];
  if(!c){h.textContent='';return}
  if(pr){
    h.textContent='Existente: '+pr.nombre+' — stock actual: '+pr.stock;
    if(p==='r'){$('r-nom').value=pr.nombre;$('r-nom').readOnly=true;if(pr.precio&&!$('r-pre').value)$('r-pre').value=pr.precio}
  }else{
    h.textContent=p==='r'?'Código nuevo: se creará un producto.':'Código no encontrado.';
    if(p==='r')$('r-nom').readOnly=false;
  }
}
$('r-cod').addEventListener('input',()=>{if(!prods[idOf(norm($('r-cod').value))]&&$('r-nom').readOnly)$('r-nom').value='';hint('r')});
$('v-cod').addEventListener('input',()=>hint('v'));

/* ---- Registrar / sumar ---- */
$('r-ok').onclick=async()=>{
  const c=idOf(norm($('r-cod').value)), n=$('r-nom').value.trim(),
        q=parseInt($('r-can').value,10), p=parseFloat($('r-pre').value)||0;
  if(!c||c==='.'||c==='..')return msg('r-msg','Ingrese un código válido.');
  if(!n)return msg('r-msg','Ingrese el nombre del producto.');
  if(!(q>0))return msg('r-msg','Ingrese una cantidad válida (mayor a 0).');
  $('r-ok').disabled=true;
  try{
    const ref=doc(db,'productos',c);
    const r=await runTransaction(db,async tx=>{
      const s=await tx.get(ref);
      if(s.exists()){
        const d=s.data(), ns=d.stock+q;
        tx.update(ref,{stock:ns,precio:p>0?p:(d.precio||0)});
        return {nuevo:false,nombre:d.nombre,stock:ns};
      }
      tx.set(ref,{nombre:n,stock:q,precio:p});
      return {nuevo:true,nombre:n,stock:q};
    });
    msg('r-msg',r.nuevo?'✔ Producto nuevo registrado: «'+r.nombre+'» con '+q+' unidades.':'✔ Se sumaron '+q+' unidades a «'+r.nombre+'». Stock total: '+r.stock,true);
    ['r-cod','r-nom','r-can','r-pre'].forEach(i=>$(i).value='');
    $('r-nom').readOnly=false;$('r-hint').textContent='';$('r-cod').focus();
  }catch(e){msg('r-msg','No se pudo guardar. Revise su conexión e intente de nuevo.')}
  $('r-ok').disabled=false;
};

/* ---- Inventario ---- */
function renderInv(){
  const q=$('i-q').value.trim().toLowerCase();let html='',uds=0,cnt=0;
  Object.keys(prods).sort().forEach(c=>{
    const p=prods[c];
    if(q&&c.toLowerCase().indexOf(q)<0&&p.nombre.toLowerCase().indexOf(q)<0)return;
    cnt++;uds+=p.stock;
    const cl=p.stock===0?'zero':(p.stock<=5?'low':'');
    html+='<tr><td>'+esc(c)+'</td><td>'+esc(p.nombre)+'</td><td class="n '+cl+'">'+p.stock+'</td><td class="n">'+money(p.precio)+'</td></tr>';
  });
  $('i-tb').innerHTML=html;$('i-em').hidden=cnt>0;
  $('i-st').innerHTML='<span>Productos: <b>'+cnt+'</b></span><span>Unidades: <b>'+uds+'</b></span><span class="low">Stock ≤ 5 resaltado</span>';
}
$('i-q').addEventListener('input',renderInv);

/* ---- Ventas ---- */
function renderVen(){
  $('v-tb').innerHTML=ventas.map(v=>'<tr><td>'+esc(new Date(v.ms).toLocaleString('es'))+'</td><td>'+esc(v.codigo)+'</td><td>'+esc(v.nombre)+'</td><td class="n">'+v.cant+'</td></tr>').join('');
  $('v-em').hidden=ventas.length>0;
}
$('v-ok').onclick=async()=>{
  const c=idOf(norm($('v-cod').value)), q=parseInt($('v-can').value,10);
  if(!c)return msg('v-msg','Ingrese el código del producto.');
  if(!(q>0))return msg('v-msg','Ingrese una cantidad válida (mayor a 0).');
  $('v-ok').disabled=true;
  try{
    const ref=doc(db,'productos',c), vref=doc(collection(db,'ventas'));
    const r=await runTransaction(db,async tx=>{
      const s=await tx.get(ref);
      if(!s.exists())return {err:'No existe un producto con el código '+c+'.'};
      const d=s.data();
      if(q>d.stock)return {err:'Stock insuficiente: solo hay '+d.stock+' unidades de «'+d.nombre+'».'};
      tx.update(ref,{stock:d.stock-q});
      tx.set(vref,{codigo:c,nombre:d.nombre,cant:q,ms:Date.now()});
      return {nombre:d.nombre,stock:d.stock-q};
    });
    if(r.err)msg('v-msg',r.err);
    else{
      msg('v-msg','✔ Venta registrada: '+q+' × «'+r.nombre+'». Stock restante: '+r.stock,true);
      $('v-cod').value='';$('v-can').value='1';$('v-hint').textContent='';$('v-cod').focus();
    }
  }catch(e){msg('v-msg','No se pudo registrar. Revise su conexión e intente de nuevo.')}
  $('v-ok').disabled=false;
};

[['r-cod','r-ok'],['r-nom','r-ok'],['r-can','r-ok'],['r-pre','r-ok'],['v-cod','v-ok'],['v-can','v-ok']].forEach(a=>
  $(a[0]).addEventListener('keydown',e=>{if(e.key==='Enter')$(a[1]).click()}));
</script>
</body>
</html>
